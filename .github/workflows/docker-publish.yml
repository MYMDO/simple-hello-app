name: Docker Image CI

# Запускати цей workflow при пуші в гілку master
on:
  push:
    branches: [ "master" ]
  # Дозволяє запускати вручну з вкладки Actions на GitHub
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-latest # Використовуємо віртуальну машину Ubuntu

    steps:
    # Крок 1: Викачуємо код з репозиторію
    - name: Checkout code
      uses: actions/checkout@v4

    # Крок 2: Логінимося в Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Крок 3: Збираємо Docker образ і пушимо його в Docker Hub
    # Образ буде мати тег 'latest' і тег з коротким хешем коміту
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: . # Використовувати поточну директорію для білд контексту
        push: true # Пушити образ після збірки
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/simple-hello-app:latest,${{ secrets.DOCKERHUB_USERNAME }}/simple-hello-app:${{ github.sha }}
        # Використовуємо ваш DOCKERHUB_USERNAME як частину імені образу
        # Тегуємо як 'latest' та унікальним тегом (хеш коміту)
        # github.sha - це змінна середовища GitHub Actions, яка містить SHA коміту
